<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>API explorer</title>
    <link rel="stylesheet" href="/__octopus/base.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="/__octopus/sdk.js"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="side-tabs" id="side-tabs"></div>
        <div class="side-tools" id="side-tools"></div>
        <div class="side-body" id="side-body"></div>
      </aside>
      <div id="vsplit" class="splitter-v"></div>
      <main id="main">
        <div id="tabbar">
          <div id="tabs"></div>
          <button class="ghost icon" id="new-tab" title="New request (⌘T)">+</button>
          <div class="grow"></div>
          <select id="env-select" title="Environment"></select>
        </div>
        <div id="pane"></div>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
